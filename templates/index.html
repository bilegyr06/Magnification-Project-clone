<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangifiCalc | Microscope Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="logo">🔬</span>
            <span>MangifiCalc</span>
        </div>
        <div class="nav-links">
            <a href="/" class="active">Calculator</a>
            <a href="/history">History</a>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Real Specimen Size Calculator</h1>
            <p class="subtitle">Measure • Magnify • Calculate</p>
        </header>

        <div class="calculator-grid">
            <!-- Input Panel -->
            <div class="panel input-panel">
                <h2>Input Specimen Data</h2>

                <form id="calcForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="username">Username <span class="required">*</span></label>
                        <input type="text" id="username" name="username" placeholder="Your name" required>
                    </div>

                    <!-- Image Upload + Magnifier -->
                    <div class="form-group">
                        <label>Specimen Image</label>
                        <div class="upload-zone" id="uploadZone">
                            <input type="file" id="specimen_image" name="specimen_image" accept="image/*" hidden>
                            <div class="upload-content">
                                <span class="upload-icon">📸</span>
                                <p>Drag & drop or click to upload</p>
                                <span class="upload-hint">Supports PNG, JPG, GIF</span>
                            </div>
                        </div>
                        <div class="image-preview" id="imagePreview" style="display:none;">
                            <div class="magnifier-wrapper">
                                <img id="previewImg" src="" alt="Specimen preview">
                                <div class="magnifier-lens" id="magnifierLens"></div>
                            </div>
                            <button type="button" class="remove-image" id="removeImage">✕</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="measured_size">Measured Size on Image (mm) <span class="required">*</span></label>
                        <input type="number" id="measured_size" name="measured_size" step="any" min="0.000001" placeholder="e.g. 12.5" required>
                    </div>

                    <!-- Magnification Toggle -->
                    <div class="form-group">
                        <label>Magnification Source</label>
                        <div class="choice-group">
                            <label class="choice-option">
                                <input type="radio" name="magnification_source" value="microscope_type" checked>
                                <span>Microscope Type</span>
                            </label>
                            <label class="choice-option">
                                <input type="radio" name="magnification_source" value="custom_magnification">
                                <span>Custom Value</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="microscopeTypeGroup">
                        <label for="microscope_type">Microscope Type</label>
                        <select id="microscope_type" name="microscope_type">
                            <!-- Populated by Flask -->
                        </select>
                    </div>

                    <div class="form-group" id="customMagnificationGroup" style="display:none;">
                        <label for="custom_magnification">Magnification Factor</label>
                        <input type="number" id="custom_magnification" name="custom_magnification" step="any" placeholder="e.g. 400">
                    </div>

                    <div class="form-group">
                        <label for="output_unit">Output Unit</label>
                        <select id="output_unit" name="output_unit">
                            <!-- Populated by Flask -->
                        </select>
                    </div>

                    <button type="submit" class="btn-calculate">Calculate Real Size</button>
                </form>
            </div>

            <!-- Result Panel -->
            <div class="panel result-panel">
                <h2>Calculation Result</h2>
                <div id="resultContainer"></div>
                <div id="resultDetails" style="display:none;">
                    <!-- Filled by JS -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 MangifiCalc — Redesigned for clarity & responsiveness</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
